name: Postman sync
on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: postman-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postman-sync:
    name: Postman sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Postman credentials
        id: credentials
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -n "$POSTMAN_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Postman sync skipped. Configure the POSTMAN_API_KEY repository secret to enable workspace syncing."
          fi
      - name: Push workspace
        if: steps.credentials.outputs.configured == 'true'
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: postman workspace push --yes
