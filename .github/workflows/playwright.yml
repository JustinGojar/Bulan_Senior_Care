name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      BCRYPT_ROUNDS: "4"
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/playwright.sqlite
      MAIL_MAILER: log
      OSCA_SUPER_ADMIN_PASSWORD: password
      OSCA_DEMO_PASSWORD: password
      OSCA_BSCA_DEFAULT_PASSWORD: password
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Install dependencies
      run: npm ci
    - name: Install frontend dependencies
      working-directory: frontend
      env:
        CYPRESS_INSTALL_BINARY: "0"
      run: npm ci --include=dev
    - uses: shivammathur/setup-php@v2
      with:
        php-version: "8.2"
        extensions: bcmath, mbstring, pdo_sqlite, zip
        coverage: none
    - name: Install backend dependencies
      working-directory: backend
      run: composer install --no-interaction --no-progress --prefer-dist
    - name: Prepare test database
      working-directory: backend
      run: |
        cp .env.example .env
        php artisan key:generate
        touch "$DB_DATABASE"
        php artisan migrate --seed --force
        # These disposable accounts represent users who finished first-login setup.
        php artisan tinker --execute="\App\Models\User::query()->update(['must_change_password' => false]);"
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
